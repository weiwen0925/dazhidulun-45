<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;

}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  line-height:1.85;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{font-size:17px;}
img{-webkit-user-drag:none;}

#top{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;}

/* ========== Sidebar ========== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
.sb-item{display:flex;flex-direction:column;align-items:center;
  text-decoration:none;color:var(--sbText);padding:3px 4px;width:100%;
  font-family:"Noto Sans TC",sans-serif;cursor:pointer;
  transition:background .2s;}
.sb-circle{width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(212,196,168,.12);
  color:var(--sbText);font-size:14px;font-weight:600;
  border:1px solid rgba(184,134,11,.3);
  transition:all .25s;}
.sb-label{font-size:10px;letter-spacing:1px;margin-top:4px;
  opacity:.7;text-align:center;line-height:1.3;}
.sb-item:hover .sb-circle{background:rgba(184,134,11,.2);}
.sb-item.active .sb-circle{
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;border-color:var(--goldL);
  box-shadow:0 0 16px rgba(184,134,11,.5);}
.sb-item.active .sb-label{opacity:1;color:var(--goldL);}

/* ========== Hamburger (mobile) ========== */
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:110;
  background:var(--sbBg);color:var(--gold);border:1px solid var(--border);
  border-radius:8px;width:42px;height:42px;font-size:20px;cursor:pointer;}

/* ========== Main ========== */
.main{margin-left:var(--sbW);max-width:1140px;padding:30px 36px 80px;
  margin-right:auto;}

/* ========== Hero ========== */
.site-hero{background:var(--headGrad);color:#fff;padding:64px 36px;
  border-radius:14px;text-align:center;position:relative;overflow:hidden;
  margin-bottom:32px;}
.site-hero::before{content:"般若";position:absolute;font-size:280px;
  color:rgba(247,232,197,.04);font-weight:900;top:50%;left:50%;
  transform:translate(-50%,-50%);letter-spacing:30px;pointer-events:none;}
.hero-title{font-size:52px;font-weight:900;color:#f7e8c5;letter-spacing:8px;
  margin-bottom:10px;position:relative;}
.hero-vol{font-size:24px;color:#cbb98a;letter-spacing:6px;margin-bottom:10px;position:relative;}
.hero-subtitle{font-size:18px;color:#e7d8b5;letter-spacing:3px;
  font-family:"Noto Sans TC",sans-serif;position:relative;margin-bottom:10px;}
.hero-range{font-size:15px;color:#a89572;letter-spacing:2px;margin-top:14px;
  font-family:"Noto Sans TC",sans-serif;position:relative;}
.hero-sub{font-size:13px;color:#8a7a55;letter-spacing:3px;margin-top:18px;
  font-family:"Noto Sans TC",sans-serif;position:relative;}

/* ========== Preface ========== */
.preface{background:var(--card);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;
  padding:28px 34px;margin:0 0 32px;}
.preface-title{font-size:26px;color:var(--accent);text-align:center;
  margin-bottom:18px;letter-spacing:4px;}
.preface p{color:var(--text2);margin:14px 0;line-height:2.1;font-size:16px;}

/* ========== TOC ========== */
.toc-section{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:28px;margin:0 0 32px;}
.toc-title{font-size:30px;color:var(--accent);text-align:center;
  letter-spacing:8px;margin-bottom:8px;}
.toc-desc{font-size:15px;color:var(--text2);text-align:center;
  margin-bottom:22px;letter-spacing:2px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.toc-card{display:flex;align-items:flex-start;gap:14px;
  padding:14px 18px;background:#fffaf0;border:1px solid var(--border-light);
  border-radius:10px;text-decoration:none;color:var(--text);
  transition:all .25s;}
.toc-card:hover{border-color:var(--gold);box-shadow:0 3px 12px rgba(184,134,11,.18);
  transform:translateY(-1px);}
.toc-num{flex:0 0 36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;}
.toc-name{font-size:16px;line-height:1.7;color:var(--text);flex:1;}

/* ========== Bridge ========== */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:20px 26px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;
  background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;
  letter-spacing:2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2;font-size:15.5px;}

/* ========== Chapter section ========== */
.chapter{margin-bottom:48px;}
.ch-head{background:var(--headGrad);color:#fff;text-align:center;
  padding:36px 28px;border-radius:14px;margin-bottom:22px;
  position:relative;overflow:hidden;}
.ch-num{font-size:13px;color:var(--goldL);letter-spacing:3px;margin-bottom:8px;
  font-family:"Noto Sans TC",sans-serif;}
.ch-name{font-size:32px;color:#f7e8c5;font-weight:900;letter-spacing:4px;
  margin-bottom:8px;}
.ch-sub{font-size:14px;color:#cbb98a;letter-spacing:2px;
  font-family:"Noto Sans TC",sans-serif;}

/* ========== iframe ========== */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

/* ========== Next link ========== */
.next-link{display:inline-block;margin-top:16px;
  background:var(--accent);color:#fff!important;
  padding:10px 24px;border-radius:24px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;text-decoration:none;
  transition:background .25s,transform .15s;}
.next-link:hover{background:var(--gold);transform:translateY(-1px);}

/* ========== Read progress capsule ========== */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ========== Back to top ========== */
#backTop{position:fixed;bottom:80px;right:24px;z-index:115;
  background:var(--sbBg);color:var(--gold);border:1px solid var(--gold);
  width:44px;height:44px;border-radius:50%;
  font-size:22px;cursor:pointer;display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.2);}
#backTop:hover{background:var(--gold);color:#fff;}
#backTop.show{display:block;}

/* ========== Footer ========== */
.site-footer{text-align:center;padding:40px 20px 30px;color:var(--text2);
  border-top:1px solid var(--border);margin-top:48px;
  font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:3px;}

/* ========== Responsive ========== */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;padding:60px 16px 60px;}
  .site-hero{padding:42px 18px;}
  .hero-title{font-size:36px;letter-spacing:4px;}
  .hero-vol{font-size:18px;}
  .ch-head{padding:24px 16px;}
  .ch-name{font-size:22px;letter-spacing:2px;}
  .toc-grid{grid-template-columns:1fr;}
}

<script>
// === sticky brand smooth scroll ===
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){sbBrand.addEventListener('click',function(e){
  e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});}

// === progress capsule ===
var rpFill=document.getElementById('rpFill');
var rpPct =document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct) rpPct.textContent =Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

// === capsule fade near footer ===
(function(){
  var cap=document.getElementById('readProgress');if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f2=document.querySelector('.site-footer');if(f2)targets.push(f2);
  if(!targets.length)return;
  if('IntersectionObserver'in window){
    var io=new IntersectionObserver(function(es){
      setHide(es.some(function(e){return e.isIntersecting;}));
    },{rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  } else {
    window.addEventListener('scroll',function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh-sb<240);
    },{passive:true});
  }
})();

// === iframe auto-resize（修正版：只讀 body.scrollHeight，無 buffer） ===
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){
  clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
var _rt=0,_riv=setInterval(function(){
  _rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);
},300);

// === outer anchor click defense ===
document.addEventListener('click',function(e){
  var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el)return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);

// === sidebar active highlight ===
function syncSidebar(){
  var chs=document.querySelectorAll('section.chapter');
  var vh=window.innerHeight;
  var active=null;
  chs.forEach(function(c){
    var r=c.getBoundingClientRect();
    if(r.top<vh*0.35)active=c;
  });
  if(!active)return;
  var id=active.id;
  document.querySelectorAll('.sb-item').forEach(function(it){
    it.classList.toggle('active',it.getAttribute('data-ch')===id);
  });
}
window.addEventListener('scroll',syncSidebar,{passive:true});
syncSidebar();

// === back to top button ===
var bt=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(bt)bt.classList.toggle('show',window.scrollY>600);
},{passive:true});

// === anti-copy outer ===
(function(){
var blk=function(e){e.preventDefault();return false;};
['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
  document.addEventListener(ev,blk,true);
});
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(e.ctrlKey&&['c','C','a','A','s','S','p','P','u','U','x','X'].indexOf(k)>=0)blk(e);
  if(k==='F12')blk(e);
  if(e.ctrlKey&&e.shiftKey&&['I','J','C','K'].indexOf(k)>=0)blk(e);
},true);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-45-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
