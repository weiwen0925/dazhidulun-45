<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:76px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;--primary:#2C1810;--primary-light:#5B3A29;--shadow:rgba(91,58,41,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:17px;line-height:1.8;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{-webkit-user-drag:none;}
/* ===== Sidebar ===== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;transition:color .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;cursor:pointer;text-decoration:none;color:var(--sbText);
  transition:opacity .2s;opacity:.75;width:100%;}
.sb-item:hover{opacity:1;}
.sb-circle{width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(212,196,168,.4);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:14px;
  transition:all .25s;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:10px;letter-spacing:1px;
  writing-mode:horizontal-tb;text-align:center;}
.sb-item.active{opacity:1;}
.sb-item.active .sb-circle{background:var(--gold);border-color:var(--goldL);
  color:#1e1a14;font-weight:700;box-shadow:0 0 12px rgba(184,134,11,.55);}
.sb-item.active .sb-label{color:var(--goldL);}
#sbToggle{display:none;position:fixed;left:14px;top:14px;z-index:200;
  width:42px;height:42px;border-radius:8px;border:1px solid var(--border);
  background:rgba(30,26,20,.9);color:var(--goldL);font-size:19px;cursor:pointer;}
/* ===== Progress capsule ===== */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}
/* ===== Main / Hero ===== */
.main{margin-left:var(--sbW);}
.site-hero{
  background:var(--headGrad);color:#f5ead3;text-align:center;
  padding:88px 24px 72px;position:relative;overflow:hidden;}
.site-hero::before{
  content:"般若";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);font-size:340px;font-weight:900;
  color:rgba(245,234,211,.04);pointer-events:none;white-space:nowrap;}
.hero-eyebrow{font-family:"Noto Sans TC",sans-serif;font-size:13px;
  letter-spacing:6px;color:var(--goldL);opacity:.9;margin-bottom:18px;}
.hero-title{font-size:46px;font-weight:900;letter-spacing:10px;
  color:var(--goldL);margin-bottom:14px;position:relative;}
.hero-subtitle{font-size:17px;letter-spacing:3px;opacity:.85;margin-bottom:22px;}
.hero-range{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:inline-block;border:1px solid rgba(212,168,75,.45);
  border-radius:20px;padding:7px 22px;color:#e8d8b0;}
.hero-skt{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;letter-spacing:1.5px;
  opacity:.55;margin-top:20px;}
/* ===== Preface ===== */
.preface{max-width:860px;margin:46px auto 8px;padding:0 26px;}
.preface-inner{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:12px;padding:30px 36px;box-shadow:0 2px 12px var(--shadow);}
.preface h2{font-family:"Noto Sans TC",sans-serif;font-size:24px;letter-spacing:6px;
  color:var(--accent);text-align:center;margin-bottom:18px;}
.preface p{color:var(--text2);line-height:2.1;font-size:16px;margin-bottom:12px;text-align:justify;}
.preface p:last-child{margin-bottom:0;}
.preface strong{color:var(--accent-red);}
/* ===== TOC ===== */
.toc-section{max-width:1100px;margin:48px auto 30px;padding:0 26px;}
.toc-title{font-size:30px;font-weight:700;letter-spacing:8px;color:var(--accent);
  text-align:center;margin-bottom:8px;}
.toc-desc{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--text-muted);text-align:center;margin-bottom:26px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
.toc-card{display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;text-decoration:none;color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s;}
.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(91,58,41,.15);}
.toc-num{flex:0 0 38px;width:38px;height:38px;border-radius:50%;
  background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;}
.toc-name{font-size:16.5px;font-weight:600;line-height:1.65;color:var(--accent);}
.toc-name small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  font-weight:400;color:var(--text-muted);margin-top:4px;letter-spacing:.5px;}
/* ===== Chapters ===== */
.chapter{margin:54px 0 0;}
.ch-head{background:var(--headGrad);color:#f5ead3;text-align:center;
  padding:46px 24px 40px;position:relative;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:18px;
  transform:translateX(-50%);width:64px;height:2px;
  background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:4px;
  color:var(--goldL);opacity:.92;margin-bottom:10px;}
.ch-name{font-size:30px;font-weight:900;letter-spacing:6px;color:#f7edd8;margin-bottom:10px;}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  color:#cdbb95;opacity:.92;}
.ch-body{max-width:980px;margin:0 auto;padding:34px 26px 30px;}
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:11px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2;font-size:15.5px;text-align:justify;}
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}
.next-link{display:block;text-align:center;margin:8px auto 0;
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--accent);text-decoration:none;padding:10px;}
.next-link:hover{color:var(--gold);}
/* ===== Footer ===== */
.site-footer{margin-top:60px;background:var(--headGrad);color:#cdbb95;
  text-align:center;padding:44px 24px;}
.site-footer .ft-title{font-size:19px;letter-spacing:5px;color:var(--goldL);margin-bottom:12px;}
.site-footer p{font-family:"Noto Sans TC",sans-serif;font-size:13px;
  letter-spacing:1.5px;line-height:2;opacity:.85;}

#backTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(184,134,11,.5);background:rgba(30,26,20,.92);color:var(--goldL);
  font-size:18px;cursor:pointer;z-index:120;display:none;
  box-shadow:0 4px 14px rgba(0,0,0,.3);}
#backTop.show{display:block;}
/* ===== RWD ===== */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .site-hero{padding:64px 18px 52px;}
  .hero-title{font-size:32px;letter-spacing:5px;}
  .ch-head{padding:34px 16px 30px;}
  .ch-name{font-size:23px;letter-spacing:3px;}
  .ch-body{padding:24px 14px 22px;}
  .toc-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:15.5px;}
  .hero-title{font-size:26px;}
}
/* ============ 1.2x 字級放大（新卷預設）============ */
body{font-size:20px!important;}
.hero-title,.site-hero h1{font-size:56px!important;}
.hero-subtitle,.site-hero .hero-subtitle{font-size:20px!important;}
.hero-sub,.site-hero .hero-sub,.hero-meta{font-size:18px!important;}
.hero-range{font-size:17px!important;}
.preface p,.preface-text p{font-size:19px!important;line-height:2.1!important;}
.preface h2,.preface-title{font-size:30px!important;}
.toc-title{font-size:34px!important;}
.toc-desc{font-size:17px!important;}
.toc-name{font-size:19.5px!important;line-height:1.7!important;}
.toc-num{font-size:17px!important;}
.bridge p{font-size:18.5px!important;line-height:2.1!important;}
.bridge-label{font-size:12.5px!important;letter-spacing:2.2px!important;}
.ch-num{font-size:18px!important;}
.ch-name{font-size:34px!important;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px!important;}
.next-link{font-size:17px!important;}
.read-progress{font-size:14px!important;padding:9px 24px!important;}
.read-progress .rp-bar{width:148px!important;height:4px!important;}
.read-progress .rp-pct{font-size:13px!important;}
.read-progress .rp-label{font-size:12px!important;}
.sb-circle{font-size:15px!important;}
.sb-label{font-size:11.5px!important;}
.site-footer,.site-footer p{font-size:15px!important;}

.sb-x-hub .sb-x-glyph{background:linear-gradient(135deg,

  font-weight:700;letter-spacing:1px;}

<script>
/* progress */
var rpFill=document.getElementById('rpFill');
var rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();
/* capsule fade near footer */
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');
  if(f1)targets.push(f1);
  var f2=document.querySelector('.site-footer');
  if(f2)targets.push(f2);
  if(!targets.length)return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      var any=entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  }else{
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh-sb<240);
    };
    window.addEventListener('scroll',check,{passive:true});
    check();
  }
})();
/* iframe auto height */
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';
    d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';
      d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){
      f.style.height=h+'px';
      f.style.minHeight='0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries<30)setTimeout(tick,200);
  }
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(resizeAllFrames,200);
});
var _rt=0,_riv=setInterval(function(){
  _rt++;resizeAllFrames();
  if(_rt>50)clearInterval(_riv);
},300);
/* anchor click with frame recalc */
document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el)return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);
/* sidebar highlight */
function highlight(){
  var secs=document.querySelectorAll('section.chapter');
  var active=null;
  secs.forEach(function(s){
    if(s.getBoundingClientRect().top<window.innerHeight*0.35)active=s;
  });
  document.querySelectorAll('.sb-item').forEach(function(it){
    it.classList.toggle('active',!!active&&it.dataset.ch===active.dataset.ch);
  });
  if(active){
    var it=document.querySelector('.sb-item.active');
    var sb=document.getElementById('sb');
    if(it&&sb){
      var r=it.getBoundingClientRect();
      if(r.top<60||r.bottom>window.innerHeight-30){
        sb.scrollTo({top:it.offsetTop-sb.clientHeight/2,behavior:'smooth'});
      }
    }
  }
}
window.addEventListener('scroll',highlight,{passive:true});
highlight();
/* brand back to top */
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
/* mobile toggle */
var sbToggle=document.getElementById('sbToggle');
if(sbToggle){
  sbToggle.addEventListener('click',function(){
    document.getElementById('sb').classList.toggle('open');
  });
}
/* back top */
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(backTop)backTop.classList.toggle('show',window.scrollY>600);
},{passive:true});
if(backTop)backTop.addEventListener('click',function(){
  window.scrollTo({top:0,behavior:'smooth'});
});
/* QA indent */
document.querySelectorAll('.ch-body p').forEach(function(p){
  var t=p.textContent.trimStart();
  if(/^(問曰：|答曰：)/.test(t))p.classList.add('qa-3');
  else if(/^(問：|答：)/.test(t))p.classList.add('qa-2');
});
</script>

(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart','mousedown'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(ev==='mousedown' && e.button!==2) return;
      blk(e);
    },true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
  setInterval(function(){
    if(window.getSelection) try{window.getSelection().removeAllRanges();}catch(e){}
  },300);
})();
</script>
<script id="wy-deeplink">
(function(){
  function parseHash(){
    var h=(location.hash||"").replace(/^#/,"");
    var m=h.match(/^chapter-(\d+)(?:-(\d+)(?:-(\d+))?)?$/);
    return m?{p:m[1],c:m[2],s:m[3],raw:h}:null;
  }
  function frameOf(p){
    var sec=document.getElementById("ch-"+p);
    if(!sec) return null;
    return sec.querySelector("iframe.ch-frame");
  }
  function go(t,attempt){
    if(!t) return;
    attempt=attempt||0;
    var sec=document.getElementById("ch-"+t.p);
    if(!sec) return;
    if(!t.c){ // 只到品
      var y0=window.scrollY+sec.getBoundingClientRect().top-10;
      window.scrollTo({top:y0,behavior:"smooth"});
      return;
    }
    var f=frameOf(t.p);
    var innerId="chapter-"+t.p+"-"+t.c+(t.s?("-"+t.s):"");
    var el=null;
    try{
      var d=f&&(f.contentDocument||(f.contentWindow&&f.contentWindow.document));
      if(d) el=d.getElementById(innerId);
    }catch(e){}
    if(!el){ // iframe 尚未解碼/算高，重試
      if(attempt<40){ setTimeout(function(){go(t,attempt+1);},250); }
      return;
    }
    if(typeof window.resizeAllFrames==="function"){ try{window.resizeAllFrames();}catch(e){} }
    setTimeout(function(){
      var fr=f.getBoundingClientRect();
      var er=el.getBoundingClientRect();
      var y=window.scrollY+fr.top+er.top-16;
      window.scrollTo({top:y,behavior:"smooth"});
    },60);
  }
  function handle(){ var t=parseHash(); if(t) go(t,0); }
  window.addEventListener("hashchange",handle);
  if(window.__wyReady&&window.__wyReady.then){
    window.__wyReady.then(function(ok){ if(ok) setTimeout(handle,400); });
  }else{
    window.addEventListener("load",function(){ setTimeout(handle,600); });
  }
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy45dzdl-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
